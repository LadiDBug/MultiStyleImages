# Configurazione del runner: cosa eseguire e dove salvare i risultati.
# definisce QUALI esperimenti eseguire


[experiment]
name = "rq1_none_vs_canny"
styles = ["gta5", "cyberpunk", "pixel_art"]

# Confronto tra baseline img2img e ControlNet Canny.
conditions = ["none", "canny", "depth", "segmentation"]

# Stesso seed per confrontare le condizioni sui tre stili.
seeds = [42]

# Percorsi relativi alla radice del repository.
[data]
input_dir = "data/raw"
output_dir = "outputs/"
