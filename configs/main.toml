# Configurazione del runner: cosa eseguire e dove salvare i risultati.
# definisce QUALI esperimenti eseguire


[experiment]
name = "rq1_baseline"
styles = ["gta5", "cyberpunk", "pixel_art"]

# Baseline img2img senza ControlNet.
conditions = ["none"]

# Un seed iniziale per verificare la baseline sui tre stili.
seeds = [42]

# Percorsi relativi alla radice del repository.
[data]
input_dir = "data/raw"
output_dir = "outputs/"
