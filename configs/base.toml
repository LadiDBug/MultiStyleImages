# Modello e parametri di generazione condivisi tra i run.
# Seed, stili e condizioni dell'esperimento sono definiti in main.toml.
# definisce COME generare

[model]
id = "stable-diffusion-v1-5/stable-diffusion-v1-5"
device = "cuda"
dtype = "float16"

[generation]
height = 512
width = 512
steps = 50

#permette di amplificare l'influenza del condizionamento testuale
# sulla generazione. Più è alta più spinge il modello verso
# caratteristiche compatibili con il prompt
guidance_scale = 7.5
strength = 0.55

# Forza del vincolo strutturale, usata solo nei rami ControlNet.
# Valore iniziale da validare nel pilot.
[controlnet]
conditioning_scale = 0.8


# Estrazione dei bordi dalla foto gia' preparata per img2img.
# Valori iniziali da validare osservando la mappa prodotta.
[preprocessing.canny]
low_threshold = 100
high_threshold = 200

# UperNet crea la mappa semantica dalla foto scelta dal runner.
# Il checkpoint ControlNet che usa la mappa e' invece in models.toml.
[preprocessing.segmentation]
model_id = "openmmlab/upernet-convnext-base"

# MiDaS stima la profondita' relativa dalla foto scelta dal runner.
# Il checkpoint ControlNet Depth e' definito in models.toml.
[preprocessing.depth]
model_id = "Intel/dpt-hybrid-midas"

