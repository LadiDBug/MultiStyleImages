# qui ci mettiamo i parametri comuni
# il nome del modello, seeds ecc
#ESEMPIO: 

seeds = [42]
condition = "none"

[model]
base = "stable-diffusion-v1-5/stable-diffusion-v1-5"
revision = "main"
device = "auto"
cache_dir = ".cache/huggingface"

[generation]
height = 512
width = 512
steps = 30
guidance_scale = 7.5
strength = 0.65
scheduler = "UniPCMultistepScheduler"
resize_mode = "center_crop"

[run]
input_dir = "src/test_images"
output_dir = "outputs/rq1"
styles = ["cyberpunk"]
limit = 1
