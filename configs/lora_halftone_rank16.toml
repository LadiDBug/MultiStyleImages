# Dataset Fumetto con retino congelato: 360 train / 40 validation.
# Nessun training e stato eseguito durante la costruzione del dataset.
[experiment]
name = "lora_halftone_comic_rank_16"
styles = ["halftone_comic"]
conditions = ["none", "canny", "depth", "segmentation"]
seeds = [42]

[data]
input_dir = "data/halftone_comic"
output_dir = "lora/halftone_comic_rank_16"

[parameters]
rank = 16
alpha = 16
max_train_steps = 1000
interpolation = "lanczos"
