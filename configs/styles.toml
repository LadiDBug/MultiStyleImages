# Prompt della baseline: uno per ciascuno stile selezionabile in main.toml.
# prompt descrive la resa desiderata; 
# negative_prompt indica elementi da evitare.

# Per il confronto RQ1, mantenere lo stesso prompt tra le condizioni di uno stile.


[styles.gta5]
prompt = "GTA V in-game open-world rendering, not illustrated loading-screen artwork: sunlit natural colors, warm golden light, crisp game textures, realistic materials and atmospheric haze. Keep natural surfaces non-emissive. Apply these to existing surfaces."
negative_prompt = "blurry, distorted, watermark, signature"
# negative_prompt = ""

[styles.pixel_art]
prompt = "Pixel art rendering: 16-bit video game style, limited palette, blocky shapes, dithering, and pixel-level detail. Apply these to existing surfaces."
negative_prompt = "blurry, watermark, signature"
# negative_prompt = ""

[styles.watercolor]
prompt = "Detailed representational watercolor painting, transparent layered washes on textured paper, clearly defined main shapes, delicate dry-brush details, visible pigment granulation, soft edges in distant areas, crisp focal details, natural color relationships, coherent perspective, hand-painted appearance. Apply these to existing surfaces." 
negative_prompt = "photograph, photorealistic, 3d render, glossy surfaces, oil painting, thick impasto, vector illustration, heavy black outlines, neon colors, text, watermark, signature"
# negative_prompt = ""